<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footer Preview — Opción B</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                950: '#0a0a0f',
              },
            },
          },
        },
      };

    <div class="flex-1 flex items-center justify-center">
      <p class="text-gray-700 text-sm">— contenido de la página —</p>
